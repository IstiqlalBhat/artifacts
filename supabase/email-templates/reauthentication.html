<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Confirm this Artifacts action</title>
  </head>
  <body style="margin:0;background:#f6f8f8;color:#071017;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Use this one-time code to confirm a sensitive Artifacts action.</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f8f8;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #d9e1e1;border-radius:8px;overflow:hidden;">
            <tr>
              <td style="padding:28px 28px 10px;">
                <div style="font-size:14px;font-weight:700;color:#071017;">Artifacts</div>
                <h1 style="margin:28px 0 12px;font-size:28px;line-height:1.15;color:#071017;">Confirm this action</h1>
                <p style="margin:0;color:#536368;font-size:16px;line-height:1.6;">Enter this one-time code in Artifacts to continue.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 28px 26px;">
                <div style="display:inline-block;background:#eef7f6;border:1px solid #b7ded8;border-radius:8px;padding:16px 20px;color:#071017;font-size:30px;line-height:1;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 28px;">
                <p style="margin:0;color:#6d7b80;font-size:13px;line-height:1.6;">This code is for {{ .Email }}. It expires automatically and should not be shared.</p>
              </td>
            </tr>
            <tr>
              <td style="background:#071017;padding:18px 28px;color:#b9c5c8;font-size:12px;line-height:1.5;">
                If you did not request this code, ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
