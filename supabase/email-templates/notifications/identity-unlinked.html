<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>A sign-in identity was unlinked</title>
  </head>
  <body style="margin:0;background:#f6f8f8;color:#071017;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f8f8;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #d9e1e1;border-radius:8px;overflow:hidden;">
            <tr>
              <td style="padding:28px;">
                <div style="font-size:14px;font-weight:700;color:#071017;">Artifacts</div>
                <h1 style="margin:28px 0 12px;font-size:26px;line-height:1.18;color:#071017;">Identity unlinked</h1>
                <p style="margin:0;color:#536368;font-size:16px;line-height:1.6;">A {{ .Provider }} sign-in identity was removed from {{ .Email }}.</p>
                <p style="margin:22px 0 0;color:#536368;font-size:14px;line-height:1.6;">If this was not you, review your login methods and reset your password.</p>
              </td>
            </tr>
            <tr>
              <td style="background:#071017;padding:18px 28px;color:#b9c5c8;font-size:12px;line-height:1.5;">Artifacts account security notification.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
